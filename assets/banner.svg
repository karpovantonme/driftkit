<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="driftkit: what a project says, against what it does">
  <style>
    .bg      { fill: #0d1117; }
    .card    { fill: #161b22; stroke: #30363d; stroke-width: 1; }
    .mono    { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .dim     { fill: #7d8590; }
    .code    { fill: #c9d1d9; }
    .good    { fill: #3fb950; }
    .bad     { fill: #f85149; }
    .title   { fill: #e6edf3; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 600; }
    .label   { fill: #7d8590; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 1.2px; }
    @media (prefers-color-scheme: light) {
      .bg    { fill: #ffffff; }
      .card  { fill: #f6f8fa; stroke: #d0d7de; }
      .dim   { fill: #59636e; }
      .code  { fill: #1f2328; }
      .title { fill: #1f2328; }
      .label { fill: #59636e; }
      .good  { fill: #1a7f37; }
      .bad   { fill: #cf222e; }
    }
  </style>

  <rect class="bg" width="1200" height="300"/>

  <text class="title" x="60" y="56" font-size="32">driftkit</text>
  <text class="dim mono" x="60" y="82" font-size="16">what a project says, against what it does</text>

  <!-- левая карточка: что написано -->
  <rect class="card" x="60" y="112" width="470" height="150" rx="8"/>
  <text class="label" x="82" y="140" font-size="11">THE DOCSTRING SAYS</text>
  <text class="mono code" x="82" y="174" font-size="15">/**</text>
  <text class="mono code" x="82" y="198" font-size="15"> * @param </text>
  <text class="mono bad"  x="176" y="198" font-size="15">$curl</text>
  <text class="mono code" x="82" y="222" font-size="15"> */</text>

  <!-- стрелка сравнения -->
  <g transform="translate(556, 187)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#7d8590" stroke-width="1.5"/>
    <line x1="0" y1="-9" x2="0" y2="9" stroke="#7d8590" stroke-width="1.5"/>
    <line x1="60" y1="-9" x2="60" y2="9" stroke="#7d8590" stroke-width="1.5"/>
    <text class="bad mono" x="22" y="-18" font-size="19" font-weight="700">≠</text>
  </g>

  <!-- правая карточка: что в коде -->
  <rect class="card" x="670" y="112" width="470" height="150" rx="8"/>
  <text class="label" x="692" y="140" font-size="11">THE SIGNATURE TAKES</text>
  <text class="mono code" x="692" y="186" font-size="15">private function initHandle</text>
  <text class="mono bad"  x="692" y="186" font-size="15" opacity="0"> </text>
  <text class="mono code" x="692" y="212" font-size="15">(</text>
  <text class="mono dim"  x="702" y="212" font-size="15">nothing</text>
  <text class="mono code" x="762" y="212" font-size="15">)</text>

  <text class="dim mono" x="60" y="278" font-size="13">17 merged · Boost · etcd · rclone · AFL++ · MNE · statsmodels · networkx</text>
  <text class="good mono" x="1140" y="278" font-size="13" text-anchor="end">447 checks green</text>
</svg>
